name: Build & Publish

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  buildConfiguration: Release
  publishEnabled: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x

    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
      id: gitversion

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Restore
      run: dotnet restore

    # GitVersion 6 dropped the nuGetVersion output, so semVer is what feeds the package version now.
    # AssemblyVersion tracks only the major, so patch and minor upgrades stay drop-in for the
    # .NET Framework consumers the netstandard2.0 target serves, which do bind on assembly version.
    # FileVersion and the package version carry the real version.
    - name: Build
      run: dotnet build -c ${{ env.buildConfiguration }} --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }} -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:AssemblyVersion=${{ steps.gitversion.outputs.major }}.0.0.0

    # xUnit v3 runs on Microsoft.Testing.Platform (see global.json), which does not accept VSTest's
    # --filter or --collect. Coverage comes from Microsoft.Testing.Extensions.CodeCoverage instead.
    # --results-directory pins where coverage lands; the default location differs between Windows and
    # Linux. Not --coverage-output, which is a single file path and would make the two target
    # frameworks overwrite each other. Each framework writes a GUID-named report here instead.
    - name: Test
      run: dotnet test -c ${{ env.buildConfiguration }} --no-build --coverage --coverage-output-format cobertura --results-directory ${{ github.workspace }}/coverage

    - name: Generate coverage summary
      if: ${{ !cancelled() }}
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: ${{ github.workspace }}/coverage/*.cobertura.xml
        targetdir: ${{ github.workspace }}/coveragereport
        reporttypes: MarkdownSummaryGithub

    - name: Publish coverage in job summary
      if: ${{ !cancelled() }}
      run: cat ${{ github.workspace }}/coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Comment coverage on pull request
      # Fork PRs only get a read-only token, so this cannot post there
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.number }}
      run: gh pr comment $PR_NUMBER --edit-last --create-if-none --body-file ${{ github.workspace }}/coveragereport/SummaryGithub.md

    - name: Upload coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ${{ github.workspace }}/coverage/*.cobertura.xml

    - name: Pack
      run: dotnet pack -c ${{ env.buildConfiguration }} --no-build -p:PackageOutputPath="${{ github.workspace }}/artifacts/" -p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ${{ github.workspace }}/artifacts/*.nupkg
          ${{ github.workspace }}/artifacts/*.snupkg

  # Runs the unit tests as a trimmed app and as a Native AOT app. The dynamic API and the reflection
  # tests cannot run there, so they are filtered out by category. Nothing here builds or publishes the package.
  trim-aot-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mode: [ trim, aot ]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Publish tests (${{ matrix.mode }})
      run: dotnet publish tests/SideData.Tests -f net10.0 -c ${{ env.buildConfiguration }} -r linux-x64 -p:Mode=${{ matrix.mode }} -o ${{ github.workspace }}/out

    - name: Run tests (${{ matrix.mode }})
      run: ${{ github.workspace }}/out/SideData.Tests --treenode-filter "/*/*/*/*[(Category!=Dynamic)&(Category!=Reflection)]"

  # Pushes the package built above. It only runs for pushes, and only after the build and both the trimmed
  # and AOT test runs have passed, so a failing run can never publish.
  publish:
    needs: [ build, trim-aot-tests ]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: nuget
        path: ${{ github.workspace }}/artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    # Trusted Publishing: exchanges a GitHub OIDC token for an API key that is valid for 1 hour,
    # so this must run immediately before the push rather than earlier in the job.
    - name: NuGet login (OIDC)
      id: nuget-login
      if: ${{ env.publishEnabled == 'true' && env.NUGET_USER != '' }}
      uses: NuGet/login@v1
      with:
        user: ${{ env.NUGET_USER }}

    - name: Push (Release)
      if: ${{ env.publishEnabled == 'true' && env.NUGET_USER != '' }}
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "${{ github.workspace }}/artifacts/"*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
